name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Disk space checks use statfs, whose fields differ between macOS and
    # Linux, so both are exercised.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Without these, the end-to-end and repack round-trip tests are skipped.
      - name: Install archivers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unrar rar 7zip unzip
      - name: Install archivers (macOS)
        if: runner.os == 'macOS'
        # Homebrew disabled the rar cask, so macOS runs extract with unar and
        # skips the tests that need rar to build fixtures; Linux covers those.
        run: brew install unar sevenzip
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o unpackdrop .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  release-config:
    # Validates .goreleaser.yml on every push, so a broken release config is
    # caught here rather than at tag time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
